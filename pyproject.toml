[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "prism"
version = "0.1.0"
description = "API gateway that translates Anthropic-style calls to OpenAI-compatible requests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/ByeDream/Prism"

[tool.setuptools.packages.find]
where = ["src"]
